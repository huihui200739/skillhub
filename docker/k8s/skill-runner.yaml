# SkillHub Playground / skill-runner Kubernetes deployment.
#
# 单实例 / 多实例用同一份 manifest，靠配置值切换（默认单实例）。
# 切换到多实例（高可用）需要同时改三处：
#   1. 本文件 ConfigMap：SKILL_RUNNER_MULTI_INSTANCE: "true" 且配好 SKILL_RUNNER_REDIS_HOST
#      （不配 Redis 时首个带 user 的 LLM 调用启动即报错）
#   2. 本文件 Deployment：replicas 改为 N（开关为 false 时必须保持 1）
#   3. marketplace 侧：PLAYGROUND_MULTI_INSTANCE=true 且已配置 REDIS_HOST
#      （不配 Redis 启动即报错；marketplace 自身副本数随之可 >1）
# 可选增强（生产 HA 建议一并启用，见文内注释块）：
#   - Deployment 内 podAntiAffinity：副本分散到不同节点
#   - 文末 PodDisruptionBudget：节点排空时至少保住一个副本
# 容量提醒：预热池（POOL_SIZE）、MAX_SESSIONS 为每实例计数，N 副本时全局 ≈ N 倍，
# skillhub-workers 的 ResourceQuota 需按 N 核算。用户日 token 上限多实例下走 Redis
# 全局共享（见 SKILL_RUNNER_REDIS_HOST），不随副本数放大。
# POD_IP 的 Downward API 注入是无条件的：单实例下开关关闭、代码不读取，无副作用。

# ── 控制面 Namespace ────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: skillhub-system
---
# ── 数据面 Namespace（动态 worker pod）──────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: skillhub-workers
  labels:
    # worker pod 非特权运行（runAsNonRoot + drop ALL caps + RuntimeDefault seccomp），
    # 满足 PSS restricted。本地与生产统一用 restricted，不再放宽为 privileged。
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ResourceQuota：防止有 bug/恶意的 skill 耗尽集群资源驱逐控制面
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workers-quota
  namespace: skillhub-workers
spec:
  hard:
    pods: "60"
    requests.cpu: "30"
    requests.memory: "60Gi"
    limits.cpu: "120"
    limits.memory: "240Gi"
---
# LimitRange：无 requests/limits 的 pod 自动注入默认值，避免 BestEffort QoS
apiVersion: v1
kind: LimitRange
metadata:
  name: workers-limits
  namespace: skillhub-workers
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "500m"
        memory: "2Gi"
      max:
        cpu: "4"
        memory: "8Gi"
---
# ── ServiceAccount（控制面，skillhub-system）────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skill-runner
  namespace: skillhub-system
---
# Role：限定在 skillhub-workers namespace，严禁授予 ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skill-runner-pod-manager
  namespace: skillhub-workers
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
# RoleBinding：SA 在 skillhub-system，Role 在 skillhub-workers（跨 namespace）
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skill-runner-pod-manager
  namespace: skillhub-workers
subjects:
  - kind: ServiceAccount
    name: skill-runner
    namespace: skillhub-system    # SA 所在 ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skill-runner-pod-manager
---
# ── Secret（LLM key，只在控制面 ns，永不注入 worker pod）──────────────────
# 注意：不要在此清单内写真实 key，也不要保留 REPLACE_ME 占位 Secret，
# 否则重复 kubectl apply 会覆盖集群里的真实 Secret。
# 请用以下方式单独创建/更新：
#   kubectl -n skillhub-system create secret generic skill-runner-llm \
#     --from-literal=SKILL_RUNNER_LLM_API_KEY=<redacted> \
#     --dry-run=client -o yaml | kubectl apply -f -
# 多实例且 Redis 需要密码时，往同一个 Secret 追加 SKILL_RUNNER_REDIS_PASSWORD=<redacted>。
---
# ── ConfigMap ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: skill-runner-env
  namespace: skillhub-system
data:
  SKILL_RUNNER_EXECUTOR: "k8s"
  # worker pod 调度到 skillhub-workers，与控制面 namespace 分离
  SKILL_RUNNER_K8S_NAMESPACE: "skillhub-workers"
  SKILL_RUNNER_PROXY_BASE_URL: "http://skill-runner.skillhub-system.svc.cluster.local:8900"
  # 固定 tag latest，不写死版本；本地 kind 靠 `kind load` 覆盖 latest + IfNotPresent。
  # 改代码后流程：build -> tag latest -> kind load -> rollout restart 控制面
  # （worker pod 每会话新建，自动用 node 上最新 latest）。
  SKILL_RUNNER_K8S_POD_IMAGE: "skill-agent-worker:latest"
  SKILL_RUNNER_K8S_IMAGE_PULL_POLICY: "IfNotPresent"
  SKILL_RUNNER_K8S_RUNTIME_CLASS: ""
  # skillworker uid=10001 作为 worker 用户，非 nobody/65534，避免 HOME=/ 写不了临时文件。
  # 非特权姿态：runAsNonRoot + drop ALL caps + RuntimeDefault seccomp，满足 PSS restricted。
  SKILL_RUNNER_POD_PRIVILEGED: "false"
  SKILL_RUNNER_POD_RUN_AS_USER: "10001"
  SKILL_RUNNER_POD_SECCOMP_PROFILE: "RuntimeDefault"
  SKILL_RUNNER_POD_READY_TIMEOUT: "120"
  SKILL_RUNNER_MAX_SESSIONS: "20"
  # 空闲超时：连续无事件 600s 视为悬挂回收，worker keepalive 15s，健康会话不触发。
  SKILL_RUNNER_SESSION_TIMEOUT: "600"
  # pod activeDeadlineSeconds 墙钟硬上限；防止长会话无限占用资源。
  SKILL_RUNNER_SESSION_MAX_LIFETIME: "1800"
  # 0 = 即用即弃；>0 = 常驻 warm pod 数，新会话直接复用省冷启动。
  SKILL_RUNNER_POOL_SIZE: "2"
  # 每用户每日 token 上限；0 = 不限。
  SKILL_RUNNER_USER_DAILY_TOKEN_LIMIT: "5000000"
  # 多实例开关：true 时 replicas 可 >1（下方 Deployment 同步调整），create 响应回带
  # 本实例地址（POD_IP 推导），marketplace 代理做会话粘性路由；worker 回连本实例。
  # false（默认）保持单副本旧行为。
  SKILL_RUNNER_MULTI_INSTANCE: "false"
  # 多实例下每用户每日 token 预算外置 Redis（多副本共享）；单实例留空走进程内存。
  # 开 MULTI_INSTANCE 时 REDIS_HOST 必填，否则首个带 user 的 LLM 调用启动即报错。
  # 密码走 Secret（追加到 skill-runner-llm），不要写进 ConfigMap。
  SKILL_RUNNER_REDIS_HOST: ""
  SKILL_RUNNER_REDIS_PORT: "6379"
  SKILL_RUNNER_REDIS_DB: "0"

  # 生产 CCE：换成专用节点池的 selector + toleration（JSON）
  # SKILL_RUNNER_K8S_NODE_SELECTOR: '{"pool":"sandbox"}'
  # SKILL_RUNNER_K8S_TOLERATIONS: '[{"key":"sandbox","operator":"Exists","effect":"NoSchedule"}]'
  # SKILL_RUNNER_K8S_RESOURCES: '{"requests":{"cpu":"500m","memory":"2Gi"},"limits":{"cpu":"2","memory":"4Gi"}}'
  SKILL_RUNNER_K8S_SERVICE_ACCOUNT: ""
  SKILL_RUNNER_K8S_IMAGE_PULL_SECRETS: ""
  SKILL_RUNNER_K8S_NODE_SELECTOR: ""
  SKILL_RUNNER_K8S_TOLERATIONS: ""
  SKILL_RUNNER_K8S_RESOURCES: ""

  SKILL_RUNNER_LLM_PROVIDER: "OpenAI"
  SKILL_RUNNER_LLM_MODEL_NAME: "doubao-seed-2-0-code"
  SKILL_RUNNER_LLM_API_BASE: "https://ark.cn-beijing.volces.com/api/coding/v3"
  # 单次生成 token 上限；32768 覆盖复盘/长对话等大输出场景（默认值与 config.py 一致，显式写出便于集群覆盖）
  SKILL_RUNNER_LLM_MAX_TOKENS: "32768"
---
# ── Deployment（控制面，skillhub-system）────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-runner
  namespace: skillhub-system
  labels:
    app: skill-runner
spec:
  # 副本数与 SKILL_RUNNER_MULTI_INSTANCE 联动：
  # - 开关 false（默认）：必须保持 1。会话编排状态（session_store / token_registry /
  #   限流计数）驻留进程内，多副本会状态不一致。
  # - 开关 true：可 >1。会话粘住创建它的实例（marketplace 按 instance_addr 路由，
  #   worker 回连本实例），实例挂掉时其会话中断、新会话落到健康实例（高可用语义）。
  #   注意 SKILL_RUNNER_MAX_SESSIONS / POOL_SIZE 为每实例计数，全局≈N 倍；用户日 token
  #   上限走 Redis 全局共享，不随副本放大。
  replicas: 1
  selector:
    matchLabels:
      app: skill-runner
  template:
    metadata:
      labels:
        app: skill-runner
    spec:
      serviceAccountName: skill-runner
      # 多实例（replicas>1）时取消注释：副本分散到不同节点，避免单节点故障
      # 带走全部副本，HA 才有意义。单实例下无效果。
      # affinity:
      #   podAntiAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         podAffinityTerm:
      #           labelSelector:
      #             matchLabels:
      #               app: skill-runner
      #           topologyKey: kubernetes.io/hostname
      containers:
        - name: skill-runner
          image: skill-runner:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["skill_runner.app:app", "--host", "$(POD_IP)", "--port", "8900"]
          ports:
            - containerPort: 8900
          envFrom:
            - configMapRef:
                name: skill-runner-env
            - secretRef:
                name: skill-runner-llm
          env:
            # Downward API 注入本 pod IP：多实例模式下推导实例回连地址
            # （http://POD_IP:8900）；单实例模式不读取，注入无副作用。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # startupProbe 在应用完成启动前托管探活：通过前 liveness/readiness 都不生效，
          # 避免冷启动（镜像拉取 / 依赖初始化）期间被 liveness 误杀。最多容忍 150s。
          startupProbe:
            httpGet: { path: /health, port: 8900 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 8900 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8900 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
# ── Service（控制面，供 worker pod 回连 LLM 代理）──────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: skill-runner
  namespace: skillhub-system
spec:
  type: ClusterIP
  selector:
    app: skill-runner
  ports:
    - name: http
      port: 8900
      targetPort: 8900
# ---
# 多实例（replicas>1）时取消注释：节点维护/排空时至少保住一个副本，
# 避免全部副本同时被驱逐导致服务整体中断。单实例下不要启用（会卡住节点排空）。
