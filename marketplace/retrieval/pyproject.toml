[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-skillsdispatch"
version = "0.1.0"
description = "openJiuwen skills dispatch SDK for index build and retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openai>=1.0",
    "numpy>=1.24",
    "rich>=13.0",
    "boto3>=1.28",
]

[project.optional-dependencies]
embedding = [
    "faiss-cpu>=1.7",
]

[tool.setuptools.packages.find]
include = ["indexing*", "models*", "orchestration*", "retrieval*", "shared*"]
exclude = ["tests*", "data*"]
