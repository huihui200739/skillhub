---
# skill-runner 控制面运行时配置（dev）。线上值的版本化来源。
# LLM key 不在此处，放 Secret skillhub-skil-runner-secret（注意 skil 拼写）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillhub-skill-runner-config
  namespace: dev
data:
  SKILL_RUNNER_EXECUTOR: "k8s"
  # worker 镜像：固定 latest + Always，重推自动生效（双 tag 时间戳留底在镜像仓库）
  # 部署前替换为你的镜像仓库地址，例：swr.<region>.myhuaweicloud.com/<project>/skill-agent-worker:latest
  SKILL_RUNNER_K8S_POD_IMAGE: "<YOUR_REGISTRY>/skill-agent-worker:latest"
  SKILL_RUNNER_K8S_IMAGE_PULL_POLICY: "Always"
  SKILL_RUNNER_K8S_NAMESPACE: "skillhub-workers"
  SKILL_RUNNER_K8S_NODE_SELECTOR: '{"skill-agent-worker":"true"}'
  SKILL_RUNNER_K8S_TOLERATIONS: '[{"key":"skill-agent-worker","operator":"Equal","value":"true","effect":"NoSchedule"}]'
  # worker 跨 ns 回连控制面 LLM 代理：必须 FQDN，裸名解析不到
  SKILL_RUNNER_PROXY_BASE_URL: "http://skill-runner.dev.svc.cluster.local:8900"
  SKILL_RUNNER_POD_PRIVILEGED: "false"
  SKILL_RUNNER_POD_RUN_AS_USER: "10001"
  # LLM（key 在 Secret）
  SKILL_RUNNER_LLM_PROVIDER: "OpenAI"
  SKILL_RUNNER_LLM_API_BASE: "https://ark.cn-beijing.volces.com/api/coding/v3"
  SKILL_RUNNER_LLM_MODEL_NAME: "doubao-seed-2-0-code"
  SKILL_RUNNER_LLM_CLIENT_ID: "skillhub-skill-runner"
  SKILL_RUNNER_LLM_TIMEOUT: "120"
  SKILL_RUNNER_LLM_MAX_TOKENS: "8192"
  SKILL_RUNNER_SESSION_TIMEOUT: "1800"
  SKILL_RUNNER_MAX_SESSIONS: "20"
  SKILL_RUNNER_WORKER_KEEPALIVE: "15"
