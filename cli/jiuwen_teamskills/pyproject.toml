[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwen-teamskills"
version = "0.0.1"
description = "CLI for TeamSkills Hub (swarmskill & skill assets)"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
    "packaging>=23.0",
    "pydantic>=2.0",
]

[project.scripts]
jiuwen-teamskills = "jiuwen_teamskills.main:main"

[tool.setuptools.packages.find]
where = [".", ".."]
include = ["jiuwen_teamskills", "jiuwen_teamskills.*", "cli_core", "cli_core.*"]
exclude = ["jiuwen_teamskills.tests*", "jiuwen_teamskills.build*"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
