name: tavily-research-kit
version: 0.0.1
display_name: Tavily Research Kit
description: Search and extract external context for issue triage and research workflows.
runtime:
  type: restful-api
metadata:
  author: openJiuwen
  tags:
  - search
  - research
  - extraction
compatibility:
  python: '>=3.11, <3.14'
api:
  base_url: 'https://api.tavily.com'
  tools_schema: schemas/tools.json
  default_headers:
    Authorization:
      type: string
      send_method: Header
      value: Bearer YOUR_TAVILY_API_KEY
      description: Tavily API bearer token.
    Content-Type:
      type: string
      send_method: Header
      value: application/json
      description: Content type for Tavily requests.
