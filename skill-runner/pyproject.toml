[project]
name = "skill-runner"
version = "0.1.0"
description = "Playground sandbox execution service for Skillhub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # k8s executor（控制面起 pod）
    "kubernetes_asyncio>=32",
    # openjiuwen (agent-core)：agent / team / runner / sys-operation 都从这里拉。
    # 带重依赖（transformers/pymilvus 等），隔离在 skill-runner 专属 venv，不污染调用方。
    "openjiuwen==0.1.15",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
